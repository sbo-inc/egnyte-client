[project]
name = "egnyte-client"
version = "0.1.0"
description = "Egnyte Public API Python Client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SB&O Inc", email = "contact@sboinc.com" }]
keywords = ["egnyte", "api", "client", "cli", "file-sharing", "storage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications :: File Sharing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "click >= 8.0.0",
    "httpx >= 0.20.0",
    "pydantic >= 2.11.0",
]

[project.urls]
Homepage = "https://github.com/sbo-inc/egnyte-client"
Repository = "https://github.com/sbo-inc/egnyte-client"
Download = "https://github.com/sbo-inc/egnyte-client/releases"
Issues = "https://github.com/sbo-inc/egnyte-client/issues"

[dependency-groups]
dev = [
    "mypy == 2.3.1",
    "ruff == 0.16.4",
    "pytest == 9.1.1",
    "pytest-asyncio == 1.4.0",
    "pytest-cov == 7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
egnyte-client = "egnyte_client.cli:main"

[build-system]
requires = ["uv_build<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md"]
